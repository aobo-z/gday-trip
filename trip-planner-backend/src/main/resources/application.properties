spring.application.name=trip-planner-backend

# Database settings
# Connection details come from the environment (see README); nothing is hard-coded.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Flyway runs before Hibernate and only handles cleanups ddl-auto can't do (dropping columns);
# baseline adopts the existing schema the first time it connects.
spring.flyway.baseline-on-migrate=true

# Uploads: the largest file any endpoint accepts (trip files, 10 MB). Each feature
# also checks its own limit in code: covers, receipts and activity photos stay at 5 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# External services. Without a key the app still starts; place search and AI features then return an error.
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash
