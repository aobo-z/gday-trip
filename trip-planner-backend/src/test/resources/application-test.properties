spring.datasource.url=jdbc:h2:mem:tripplanner;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only signing key; production continues to use the JWT_SECRET environment variable.
jwt.secret=jenkins-test-only-jwt-secret-32-bytes-minimum
jwt.expiration-ms=86400000

# External Discovery clients are not called by backend tests, but their
# configuration properties must still be present when the Spring context loads.
google.places.api-key=test-google-places-key
gemini.api-key=test-gemini-key
gemini.model=gemini-test-model

# Tests build an H2 schema with create-drop; the MySQL cleanup script doesn't apply here.
spring.flyway.enabled=false
